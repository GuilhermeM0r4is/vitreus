[package]
name = "vitreus"
version = "0.1.0"
description = "Vitreus - gridless VTT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[[bin]]
name = "vitreus"
path = "src/main.rs"

[profile.release]
# Keep the shipped binary small and idle CPU/memory low, matching the
# "fanless MacBook Air" goal from the original spec.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
